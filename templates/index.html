<!DOCTYPE html>
<html>
<head>
    <title>AI工程文件(IOM)生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">AI工程文件(IOM)生成器</h2>

    <div class="card p-3 mb-4">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">產品名稱</label>
                <input name="product" class="form-control" placeholder="例如：工業馬達">
            </div>

            <div class="mb-3">
                <label class="form-label">規格</label>
                <input name="spec" class="form-control" placeholder="例如：220V / 2HP">
            </div>

            <div class="mb-3">
                <label class="form-label">用途</label>
                <input name="usage" class="form-control" placeholder="例如：輸送帶驅動">
            </div>

            <button type="submit" class="btn btn-primary">
                生成文件
            </button>

         </form>
</div>


{% if result %}


<div class="card p-3 mb-4">
    <h5>本次生成結果</h5>
    <pre>{{ result }}</pre>
</div>

{% endif %}


<h4>歷史紀錄</h4>

{% for r in records %}

    <div class="card p-3 mb-3">

        <b>產品：</b>{{ r[1] }}<br>
        <b>規格：</b>{{ r[2] }}<br>
        <b>用途：</b>{{ r[3] }}<br>

        <hr>

        <pre>{{ r[4] }}</pre>

        <div style="margin-top:10px;">

            <a href="/delete/{{ r[0] }}" class="btn btn-danger btn-sm">
                刪除
            </a>

            <a href="/download/{{ r[0] }}" class="btn btn-success btn-sm">
                下載
            </a>

        </div>

</div>

{% endfor %}

</div>

</body>
</html>
